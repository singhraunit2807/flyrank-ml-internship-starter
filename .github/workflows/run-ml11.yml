name: Run ML-11 Capstone

on:
  workflow_dispatch:
  push:
    paths:
      - "work/notebooks/capstone.ipynb"
      - ".github/workflows/run-ml11.yml"

permissions:
  contents: write

jobs:
  run-capstone:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbformat nbconvert ipykernel
      - name: Execute capstone notebook
        run: |
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=1200 --inplace work/notebooks/capstone.ipynb
      - name: Commit executed notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/notebooks/capstone.ipynb
          git diff --cached --quiet || git commit -m "Execute ML-11 capstone notebook"
          git push
