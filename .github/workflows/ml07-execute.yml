name: ML-07 Execute Baseline Notebook

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-ml07:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy jupyter nbconvert

      - name: Download the public starter dataset to the runner
        run: |
          mkdir -p /tmp/flyrank-data
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/flyrank-bih/flyrank-ml-internship-starter/main/data/raw/content_refresh_anonymized.csv \
            -o /tmp/flyrank-data/content_refresh_anonymized.csv

      - name: Execute notebook from top to bottom
        env:
          FLYRANK_DATA_PATH: /tmp/flyrank-data/content_refresh_anonymized.csv
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute work/notebooks/w04_baseline_score.ipynb \
            --output /tmp/w04_baseline_score_executed.ipynb \
            --ExecutePreprocessor.timeout=300
          mv /tmp/w04_baseline_score_executed.ipynb work/notebooks/w04_baseline_score.ipynb

      - name: Remove generated CSV before commit
        run: |
          rm -f work/outputs/baseline_action_score.csv

      - name: Commit executed notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/notebooks/w04_baseline_score.ipynb
          git add -u
          git diff --cached --quiet || git commit -m "Execute ML-07 baseline action score notebook"
          git push
